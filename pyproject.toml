[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cpa-imagegen"
version = "0.1.0"
description = "Portable image generation CLI and agent skill for CPA-compatible gateways"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "calmlim"}]
dependencies = [
  "openai>=2,<3",
  "httpx>=0.27,<1",
  "Pillow>=11,<14",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
cpa-imagegen = "cpa_imagegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpa_imagegen = ["data/skill/*.md", "data/skill/agents/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
