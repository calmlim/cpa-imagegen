name: Offline tests and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Install wheel and smoke-test packaged skill outside checkout
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as folder:
              subprocess.run([sys.executable, '-m', 'cpa_imagegen', '--version'], cwd=folder, check=True)
              subprocess.run([sys.executable, '-m', 'cpa_imagegen', 'install-skill', '--agent', 'codex', '--dest', str(pathlib.Path(folder) / 'skill'), '--json'], cwd=folder, check=True)
